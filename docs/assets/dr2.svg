<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Rule DR2: two structural relationships in a row give the weaker of the two as a derived relationship."><title>Rule DR2: two structural relationships in a row give the weaker of the two as a derived relationship.</title><rect width="1200" height="470" fill="#f7f7f7"/><rect x="48" y="39" width="12" height="12" rx="0" fill="#ff4500"/><text x="70" y="50" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">DERIVATION RULE DR2</text><text x="47" y="92" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">A derived relationship is a shortcut over a chain.</text><rect x="48" y="140" width="640" height="290" rx="0" fill="#eceef1"/><rect x="88" y="340" width="170" height="60" rx="3" fill="#c1ffb1" stroke="#1a2432" stroke-width="2"/><text x="173.0" y="375.4" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">Mainframe</text><text x="173.0" y="420" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="0">Node</text><rect x="283.0" y="180" width="170" height="60" rx="3" fill="#c1ffb1" stroke="#1a2432" stroke-width="2"/><text x="368.0" y="206.55" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">Operating</text><text x="368.0" y="224.25" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">System</text><text x="368.0" y="170" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="0">System Software</text><rect x="478" y="340" width="170" height="60" rx="3" fill="#c1ffb1" stroke="#1a2432" stroke-width="2"/><text x="563.0" y="366.54999999999995" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">SAP ERP</text><text x="563.0" y="384.24999999999994" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">software</text><text x="563.0" y="420" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="0">System Software</text><polygon points="148.0,340.0 160.3,339.0 166.8,328.6 154.6,329.6" fill="#1a2432"/><line x1="166.81435229418838" y1="328.59736224594644" x2="313.0" y2="240" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><text x="108" y="290" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">composition</text><circle cx="426.4" cy="242.1" r="5" fill="#1a2432"/><line x1="423.0" y1="240" x2="581.1584173475678" y2="335.8535862712532" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polygon points="588,340 574.3168346951356,339.4246850951364 581.1584173475678,328.1360737186234" fill="#1a2432"/><text x="538" y="290" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">assignment</text><circle cx="266.0" cy="370.0" r="5" fill="#b7791f"/><line x1="262" y1="370.0" x2="464.0" y2="370.0" stroke="#b7791f" stroke-width="2" stroke-linecap="butt"/><polygon points="472,370.0 460.0,376.6 460.0,363.4" fill="#b7791f"/><rect x="296.0" y="382.0" width="143.68" height="22" rx="0" fill="#fff8ec" stroke="#f5c86a" stroke-width="1"/><text x="367.84000000000003" y="397.32" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#7a4f00" text-anchor="middle" letter-spacing="0">assignment, derived</text><circle cx="88" cy="340" r="12" fill="#1a2432"/><text x="88" y="345" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">a</text><circle cx="283.0" cy="180" r="12" fill="#1a2432"/><text x="283.0" y="185" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">b</text><circle cx="478" cy="340" r="12" fill="#1a2432"/><text x="478" y="345" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">c</text><text x="730" y="152" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">THE MODEL SAYS</text><text x="730" y="184" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1a2432" text-anchor="start" letter-spacing="0">a  —structural→  b  —structural→  c</text><text x="730" y="236" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">SO YOU MAY DRAW</text><text x="730" y="268" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#b7791f" text-anchor="start" letter-spacing="0">a  —the weaker of the two→  c</text><text x="730" y="320" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">ON THE CASE</text><text x="730" y="348" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">The mainframe is composed of its operating</text><text x="730" y="370" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">system, which is assigned to the SAP software.</text><text x="730" y="392" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">Assignment is weaker than composition, so the</text><text x="730" y="414" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">shortcut is an assignment.</text><text x="48" y="456" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">ArchiMate 3.2, Appendix B. Rule as encoded in archimate_ontology (A. D. Mendoza). Wording simplified.</text></svg>
