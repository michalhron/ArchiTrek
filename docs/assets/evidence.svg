<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Direct, derived, potential and association links, with hop costs 1, 5, 20 and 100."><title>Direct, derived, potential and association links, with hop costs 1, 5, 20 and 100.</title><rect width="1200" height="580" fill="#f7f7f7"/><rect x="48" y="39" width="12" height="12" rx="0" fill="#ff4500"/><text x="70" y="50" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">FOUR KINDS OF LINK</text><text x="47" y="92" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">How sure is the language that two things connect?</text><text x="48" y="136" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">KIND</text><text x="250" y="136" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">WHAT IT MEANS</text><text x="1004" y="136" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">HOP COST</text><rect x="48" y="150" width="1104" height="82" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="48" y="150" width="6" height="82" rx="0" fill="#86efac"/><text x="76" y="198" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Direct</text><text x="250" y="188" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">In the Appendix B table for that exact pair, in capitals.</text><text x="250" y="212" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Draw it.</text><line x1="800" y1="191.0" x2="930" y2="191.0" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polyline points="918.0,197.6 930,191.0 918.0,184.4" fill="none" stroke="#1a2432" stroke-width="2"/><rect x="1004" y="174" width="100" height="34" rx="0" fill="#ecfdf3" stroke="#86efac" stroke-width="1"/><text x="1054" y="197" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">1</text><rect x="48" y="242" width="1104" height="82" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="48" y="242" width="6" height="82" rx="0" fill="#93c5fd"/><text x="76" y="290" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Derived</text><text x="250" y="280" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">A chain of direct relationships licenses it (B.2, DR1–DR8).</text><text x="250" y="304" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1a2432" text-anchor="start" letter-spacing="0">True if the chain is.</text><line x1="800" y1="283.0" x2="930" y2="283.0" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polyline points="918.0,289.6 930,283.0 918.0,276.4" fill="none" stroke="#1a2432" stroke-width="2"/><text x="865" y="273.0" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1a2432" text-anchor="middle" letter-spacing="0">derived</text><rect x="1004" y="266" width="100" height="34" rx="0" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/><text x="1054" y="289" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1a2432" text-anchor="middle" letter-spacing="0">5</text><rect x="48" y="334" width="1104" height="82" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="48" y="334" width="6" height="82" rx="0" fill="#fcd34d"/><text x="76" y="382" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Potential</text><text x="250" y="372" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">A weaker chain suggests it (B.3, PDR1–PDR12).</text><text x="250" y="396" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#92400e" text-anchor="start" letter-spacing="0">Check it first.</text><line x1="800" y1="375.0" x2="930" y2="375.0" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polyline points="918.0,381.6 930,375.0 918.0,368.4" fill="none" stroke="#1a2432" stroke-width="2"/><text x="865" y="365.0" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#92400e" text-anchor="middle" letter-spacing="0">potential</text><rect x="1004" y="358" width="100" height="34" rx="0" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><text x="1054" y="381" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="0">20</text><rect x="48" y="426" width="1104" height="82" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="48" y="426" width="6" height="82" rx="0" fill="#fb923c"/><text x="76" y="474" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Association</text><text x="250" y="464" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">Allowed between any two elements (§5.2.4).</text><text x="250" y="488" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#9a3412" text-anchor="start" letter-spacing="0">Related, not how.</text><line x1="800" y1="467.0" x2="930" y2="467.0" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><rect x="1004" y="450" width="100" height="34" rx="0" fill="#fff7ed" stroke="#fb923c" stroke-width="1"/><text x="1054" y="473" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle" letter-spacing="0">100</text><text x="48" y="558" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">The search adds up hop costs, so it takes three direct hops before one derived hop. You can change the costs in Advanced options.</text></svg>
