<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="How ArchiTrek works: pick element types, search Appendix B, rank routes, explain hops, export."><title>How ArchiTrek works: pick element types, search Appendix B, rank routes, explain hops, export.</title><rect width="1200" height="430" fill="#f7f7f7"/><rect x="48" y="39" width="12" height="12" rx="0" fill="#ff4500"/><text x="70" y="50" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">HOW IT WORKS</text><text x="47" y="92" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">From two element types to a route you can defend.</text><rect x="48" y="170" width="196" height="200" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="48" y="170" width="196" height="4" rx="0" fill="#1a2432"/><circle cx="82" cy="214" r="16" fill="#1a2432"/><text x="82" y="220" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">1</text><text x="68" y="274" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Pick</text><text x="68" y="308" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">two or more</text><text x="68" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">element types</text><line x1="248" y1="270" x2="268" y2="270" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polygon points="272,270 263.0,274.95 263.0,265.05" fill="#1a2432"/><rect x="274" y="170" width="196" height="200" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="274" y="170" width="196" height="4" rx="0" fill="#ff4500"/><circle cx="308" cy="214" r="16" fill="#1a2432"/><text x="308" y="220" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">2</text><text x="294" y="274" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Search</text><text x="294" y="308" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">the ArchiMate 3.2</text><text x="294" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">Appendix B tables</text><line x1="474" y1="270" x2="494" y2="270" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polygon points="498,270 489.0,274.95 489.0,265.05" fill="#1a2432"/><rect x="500" y="170" width="196" height="200" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="500" y="170" width="196" height="4" rx="0" fill="#1a2432"/><circle cx="534" cy="214" r="16" fill="#1a2432"/><text x="534" y="220" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">3</text><text x="520" y="274" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Rank</text><text x="520" y="308" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">routes by evidence:</text><text x="520" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">direct before derived</text><line x1="700" y1="270" x2="720" y2="270" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polygon points="724,270 715.0,274.95 715.0,265.05" fill="#1a2432"/><rect x="726" y="170" width="196" height="200" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="726" y="170" width="196" height="4" rx="0" fill="#1a2432"/><circle cx="760" cy="214" r="16" fill="#1a2432"/><text x="760" y="220" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">4</text><text x="746" y="274" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Explain</text><text x="746" y="308" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">every hop, with</text><text x="746" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">its rule and section</text><line x1="926" y1="270" x2="946" y2="270" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polygon points="950,270 941.0,274.95 941.0,265.05" fill="#1a2432"/><rect x="952" y="170" width="196" height="200" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="952" y="170" width="196" height="4" rx="0" fill="#1a2432"/><circle cx="986" cy="214" r="16" fill="#1a2432"/><text x="986" y="220" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">5</text><text x="972" y="274" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Export</text><text x="972" y="308" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">to PNG, PDF, CSV</text><text x="972" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">or Archi (XML)</text><text x="48" y="408" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">Everything runs in your browser. Your routes and settings stay on your device.</text></svg>
