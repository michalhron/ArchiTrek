<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="The business, application and technology layers, each serving the one above."><title>The business, application and technology layers, each serving the one above.</title><rect width="1200" height="380" fill="#f7f7f7"/><rect x="48" y="39" width="12" height="12" rx="0" fill="#ff4500"/><text x="70" y="50" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" letter-spacing="2.2">LAYERS</text><text x="47" y="92" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Each layer serves the one above it.</text><rect x="48" y="120" width="1104" height="72" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="48" y="120" width="10" height="72" rx="0" fill="#f5e87a"/><text x="80" y="164" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Business</text><text x="260" y="164" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">The organisation: processes, functions, roles, services.</text><rect x="900" y="130" width="200" height="52" rx="10" fill="#fffbe6" stroke="#1a2432" stroke-width="2"/><text x="1000.0" y="152.78" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">Business</text><text x="1000.0" y="169.3" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">Function</text><line x1="1000" y1="216" x2="1000" y2="182" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polyline points="1006.6,194.0 1000,182 993.4,194.0" fill="none" stroke="#1a2432" stroke-width="2"/><rect x="48" y="206" width="1104" height="72" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="48" y="206" width="10" height="72" rx="0" fill="#bfffff"/><text x="80" y="250" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Application</text><text x="260" y="250" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">The software: components, application services, data.</text><rect x="900" y="216" width="200" height="52" rx="3" fill="#bfffff" stroke="#1a2432" stroke-width="2"/><text x="1000.0" y="238.78" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">Application</text><text x="1000.0" y="255.3" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">Component</text><line x1="1000" y1="302" x2="1000" y2="268" stroke="#1a2432" stroke-width="2" stroke-linecap="butt"/><polyline points="1006.6,280.0 1000,268 993.4,280.0" fill="none" stroke="#1a2432" stroke-width="2"/><rect x="48" y="292" width="1104" height="72" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="48" y="292" width="10" height="72" rx="0" fill="#c1ffb1"/><text x="80" y="336" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1a2432" text-anchor="start" letter-spacing="0">Technology</text><text x="260" y="336" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" letter-spacing="0">The machines: nodes, devices, system software, artifacts.</text><rect x="900" y="302" width="200" height="52" rx="3" fill="#c1ffb1" stroke="#1a2432" stroke-width="2"/><text x="1000.0" y="333.04" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1a2432" text-anchor="middle" letter-spacing="0">Node</text></svg>
