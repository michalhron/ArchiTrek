<template id="case01-template" data-composition-id="01-case" data-width="1920" data-height="1080" data-duration="11.18">
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
    @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
    @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
      color: #1a2432;
    }

    #case01-bg {
      position: absolute;
      inset: 0;
      background: #f7f7f7;
    }

    #case01-stage {
      position: absolute;
      inset: 0;
      transform-origin: 960px 490px;
    }

    /* ---- kicker ---- */
    #case01-kicker {
      position: absolute;
      left: 96px;
      top: 88px;
      height: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #case01-kicker-sq {
      width: 12px;
      height: 12px;
      background: #ff4500;
    }
    #case01-kicker-text {
      font-size: 22px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #4a5568;
      white-space: nowrap;
    }

    /* ---- layer bands (shared layout with 10-your-turn) ---- */
    [class~="case01-band"] {
      position: absolute;
      left: 96px;
      width: 1728px;
      height: 220px;
      transform-origin: 0 50%;
    }
    #case01-band-bus  { top: 150px; background: rgba(245, 232, 122, 0.35); }
    #case01-band-app  { top: 380px; background: rgba(191, 255, 255, 0.45); }
    #case01-band-tech { top: 610px; background: rgba(193, 255, 177, 0.45); }

    [class~="case01-band-label"] {
      position: absolute;
      left: 116px;
      font-size: 20px;
      line-height: 1;
      font-weight: 600;
      color: rgba(26, 36, 50, 0.75);
      white-space: nowrap;
    }
    #case01-label-bus  { top: 184px; }
    #case01-label-app  { top: 414px; }
    #case01-label-tech { top: 644px; }

    /* ---- element boxes ---- */
    [class~="case01-el"] {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid #1a2432;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      color: #1a2432;
    }
    [class~="case01-glyph"] {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 24px;
      height: 24px;
    }
    #case01-fn {
      left: 760px; top: 210px; width: 320px; height: 100px;
      background: #fffbe6;
      border-radius: 10px;
    }
    #case01-actor {
      left: 1260px; top: 210px; width: 260px; height: 100px;
      background: #fffbe6;
      border-radius: 3px;
    }
    #case01-node {
      left: 790px; top: 670px; width: 260px; height: 100px;
      background: #c1ffb1;
      border-radius: 3px;
    }

    /* ---- connectors overlay ---- */
    #case01-wires {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: visible;
    }

    /* ---- hop badge ---- */
    #case01-badge {
      position: absolute;
      left: 892px;
      top: 462px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #1a2432;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
    }
  </style>

  <div id="root" data-composition-id="01-case" data-width="1920" data-height="1080">
    <div id="case01-bg" class="clip" data-start="0" data-duration="11.18" data-track-index="0"></div>

    <div id="case01-stage" class="clip" data-start="0" data-duration="11.18" data-track-index="1">
      <div id="case01-kicker">
        <div id="case01-kicker-sq"></div>
        <div id="case01-kicker-text">The case</div>
      </div>

      <div id="case01-band-bus" class="case01-band"></div>
      <div id="case01-band-app" class="case01-band"></div>
      <div id="case01-band-tech" class="case01-band"></div>
      <div id="case01-label-bus" class="case01-band-label">Business</div>
      <div id="case01-label-app" class="case01-band-label">Application</div>
      <div id="case01-label-tech" class="case01-band-label">Technology</div>

      <svg id="case01-wires" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="case01-hop-clip">
            <rect id="case01-hop-reveal" x="900" y="670" width="40" height="0"></rect>
          </clipPath>
        </defs>
        <!-- dashed hop line, Mainframe top (920,670) up to the function bottom (920,310) -->
        <g clip-path="url(#case01-hop-clip)">
          <line id="case01-hop-line" x1="920" y1="670" x2="920" y2="310" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 10"></line>
        </g>
        <!-- assignment: dot at Finance Department (1260,260), arrowhead at the function (1080,260) -->
        <line id="case01-assign-line" x1="1260" y1="260" x2="1092" y2="260" stroke="#1a2432" stroke-width="2.5" stroke-dasharray="168" stroke-dashoffset="0"></line>
        <circle id="case01-assign-dot" cx="1260" cy="260" r="6" fill="#1a2432"></circle>
        <polygon id="case01-assign-head" points="1080,260 1096,252 1096,268" fill="#1a2432"></polygon>
      </svg>

      <div id="case01-node" class="case01-el">
        Mainframe
        <svg class="case01-glyph" viewBox="0 0 24 24" fill="none" stroke="#1a2432" stroke-width="1.8" stroke-linejoin="round">
          <path d="M3 8 L8 3 L21 3 L21 16 L16 21 L3 21 Z"></path>
          <path d="M3 8 L16 8 L21 3 M16 8 L16 21"></path>
        </svg>
      </div>

      <div id="case01-fn" class="case01-el">
        Financial Transaction<br>Processing
        <svg class="case01-glyph" viewBox="0 0 24 24" fill="none" stroke="#1a2432" stroke-width="1.8" stroke-linejoin="round">
          <path d="M4 10 L12 3 L20 10 L20 21 L12 15 L4 21 Z"></path>
        </svg>
      </div>

      <div id="case01-actor" class="case01-el">
        Finance<br>Department
        <svg class="case01-glyph" viewBox="0 0 24 24" fill="none" stroke="#1a2432" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="5" r="3"></circle>
          <path d="M12 8 L12 15 M6 11 L18 11 M12 15 L7 22 M12 15 L17 22"></path>
        </svg>
      </div>

      <div id="case01-badge">?</div>
    </div>
  </div>

  <script>
    (function () {
      // Voice cue times (seconds from frame start). Re-time the frame by editing this object only.
      const CUES = {
        An: 0.000,
        insurance: 0.514,
        company: 1.187,
        does: 1.861,
        its: 2.133,
        bookkeeping: 2.404,
        on: 3.078,
        an: 3.349,
        old: 3.621,
        mainframe: 3.892,
        Its: 4.713,
        architects: 5.007,
        must: 5.734,
        show: 6.027,
        how: 6.320,
        that: 6.613,
        machine: 6.906,
        supports: 7.416,
        the: 7.926,
        finance: 8.219,
        departments: 8.729,
        work: 9.457,
        END: 10.68
      };
      const END = CUES.END;
      // Start a reveal at its cue, but early enough that it completes before the frame ends.
      const at = (t, dur) => Math.max(0, Math.min(t, END - dur - 0.1));

      const q = (s) => document.getElementById(s);
      const stage = q("case01-stage");
      const kicker = q("case01-kicker");
      const bands = [q("case01-band-bus"), q("case01-band-app"), q("case01-band-tech")];
      const labels = [q("case01-label-bus"), q("case01-label-app"), q("case01-label-tech")];
      const node = q("case01-node");
      const fn = q("case01-fn");
      const actor = q("case01-actor");
      const aLine = q("case01-assign-line");
      const aDot = q("case01-assign-dot");
      const aHead = q("case01-assign-head");
      const hopReveal = q("case01-hop-reveal");
      const badge = q("case01-badge");

      const tl = gsap.timeline({ paused: true });

      // Slow push-in under the whole shot.
      tl.fromTo(stage, { scale: 1 }, { scale: 1.02, duration: END, ease: "none" }, 0);

      // ---- Scene 1: kicker sets, three empty bands draw in from the left ----
      tl.fromTo(kicker, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUES.An);
      tl.fromTo(bands, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut", stagger: 0.22 }, CUES.insurance);
      tl.fromTo(labels, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", stagger: 0.22 }, CUES.insurance + 0.45);

      // ---- Scene 2: the Mainframe rises into the Technology band ----
      tl.fromTo(node, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at(CUES.old, 0.55));
      // A small nudge as the voice names "that machine" again.
      tl.fromTo(node, { scale: 1 }, { scale: 1.05, duration: 0.18, ease: "power2.out" }, at(CUES.machine, 0.4));
      tl.to(node, { scale: 1, duration: 0.22, ease: "power2.inOut" }, at(CUES.machine, 0.4) + 0.18);

      // ---- Scene 3: the finance work rises into the Business band, then the assignment draws ----
      const fnAt = at(CUES.finance, 0.45);
      const actorAt = at(CUES.departments, 0.45);
      tl.fromTo(fn, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, fnAt);
      tl.fromTo(actor, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, actorAt);
      const arrowAt = at(actorAt + 0.3, 0.3);
      tl.fromTo(aDot, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, arrowAt);
      tl.fromTo(aLine, { strokeDashoffset: 168 }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, arrowAt);
      tl.fromTo(aHead, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, arrowAt + 0.2);

      // ---- Scene 4 (last ~1s): dashed hop line climbs the empty Application band, "?" badge pops. Hold. ----
      const hopAt = at(CUES.work, 0.85);
      tl.fromTo(hopReveal, { attr: { y: 670, height: 0 } }, { attr: { y: 310, height: 360 }, duration: 0.45, ease: "power2.inOut" }, hopAt);
      tl.fromTo(badge, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, hopAt + 0.4);

      // Pin the timeline length to the frame duration (hold to the end).
      tl.set({}, {}, END);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-case"] = tl;
    })();
  </script>
</template>
