<script src="assets/vendor/gsap.min.js"></script>
<style>
@font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }

  #root {

  .o1tb-kicker-sq {
    width: 12px;

  /* ArchiMate element boxes, as the app draws them */
  .o1tb-el {
    position: absolute;

  #o1tb-node {

  #o1tb-func {

  /* hop line between the two boxes */
  #o1tb-hop {

<div
  id="root"
  data-composition-id="01-two-boxes"
  data-start="0"
  data-duration="5.151"
  data-width="1920"
  data-height="1080"
>
  <div id="o1tb-bg" class="clip" data-start="0" data-duration="5.151" data-track-index="0"></div>

  <div id="o1tb-stage" class="clip" data-start="0" data-duration="5.151" data-track-index="1">
    <div id="o1tb-kicker"><span class="o1tb-kicker-sq"></span><span>ArchiMate 3.2</span></div>

    <div id="o1tb-hop">
      <svg width="540" height="8" viewBox="0 0 540 8" aria-hidden="true">
        <line x1="0" y1="4" x2="540" y2="4" stroke="#94a3b8" stroke-width="4" stroke-dasharray="14 10" />
      </svg>
      <div id="o1tb-hop-cover"></div>
    </div>

    <div id="o1tb-node" class="o1tb-el">
      Node
      <svg id="o1tb-node-glyph" class="o1tb-glyph" viewBox="0 0 34 34" fill="none" stroke="#1a2432" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 11 L11 4 L30 4 L30 23 L23 30 L4 30 Z" />
        <path d="M4 11 L23 11 L23 30" />
        <path d="M23 11 L30 4" />
      </svg>
    </div>

    <div id="o1tb-func" class="o1tb-el">
      Business Function
      <svg id="o1tb-func-glyph" class="o1tb-glyph" viewBox="0 0 34 34" fill="none" stroke="#1a2432" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12 L17 4 L29 12 L29 30 L17 23 L5 30 Z" />
      </svg>
    </div>

    <div id="o1tb-badge">?</div>
  </div>
</div>

<script>
  (function () {
    // Every voice cue, seconds from frame start. Re-time the frame by editing this object only.
    const CUES = {
      every: 0.0,
      archimate: 0.601,
      student: 1.202,
      hits: 1.623,
      thisWord: 1.865,
      question: 2.107,
      how: 2.979,
      doWord: 3.202,
      these: 3.426,
      two: 3.649,
      boxes: 3.873,
      connect: 4.262,
    };
    const END = 4.651;
    const MIN_TAIL = 0.35;
    const MARGIN = 0.04;
    // Clamp a reveal so it starts no later than END - MIN_TAIL and finishes before END.
    function fit(start, dur) {
      const s = Math.max(0, Math.min(start, END - MIN_TAIL));
      const d = Math.max(0.12, Math.min(dur, END - MARGIN - s));
      return { s: s, d: d };
    }

    const tl = gsap.timeline({ paused: true });

    // Macro camera: slow push-in under the whole shot.
    tl.fromTo("#o1tb-stage", { scale: 1 }, { scale: 1.035, duration: END, ease: "none" }, 0);

    // Scene 1 — kicker fades in on the canvas.
    let r = fit(CUES.every + 0.1, 0.5);
    tl.fromTo("#o1tb-kicker", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: r.d, ease: "power2.out" }, r.s);

    // Scene 1 — Node rises into the left third on "ArchiMate student".
    r = fit(CUES.archimate - 0.2, 0.75);
    tl.fromTo("#o1tb-node", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: r.d, ease: "power3.out" }, r.s);
    r = fit(CUES.hits, 0.4);
    tl.fromTo("#o1tb-node-glyph", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: r.d, ease: "back.out(2)" }, r.s);

    // Scene 2 — Business Function rises into the right third on "How do these two boxes".
    r = fit(CUES.how, 0.75);
    tl.fromTo("#o1tb-func", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: r.d, ease: "power3.out" }, r.s);
    r = fit(CUES.two, 0.35);
    tl.fromTo("#o1tb-func-glyph", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: r.d, ease: "back.out(2)" }, r.s);

    // Scene 3 — dashed hop line draws left to right, "?" badge pops at its midpoint on "connect".
    r = fit(CUES.boxes, 0.45);
    tl.fromTo("#o1tb-hop-cover", { x: 0 }, { x: 540, duration: r.d, ease: "power2.inOut" }, r.s);
    r = fit(CUES.connect - 0.06, 0.32);
    tl.fromTo("#o1tb-badge", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: r.d, ease: "back.out(2.2)" }, r.s);

    window.__timelines = window.__timelines || {};
    window.__timelines["01-two-boxes"] = tl;
  })();
</script>
</template>
