  <script>
    (function () {
      // Voice cue times (seconds from frame start). Re-time the frame by editing this object only.
      const CUES = {
        The: 0.242,
        relationship: 1.960,
        business: 3.573,
        table: 5.585,
        tells: 5.918,
        you: 1.524,
        what: 6.109,
        is: 1.991,
        allowed: 6.491,
        It: 7.183,
        does: 3.672,
        not: 3.937,
        tell: 4.204,
        you2: 4.470,
        through: 7.405,
        whatEnd: 11.117
      };
      const DUR = 8.64;
      const S2_TAIL = 1.05; // time Scene 2 needs to fully land before the frame ends

      const q = (sel) => Array.prototype.slice.call(document.querySelectorAll(sel));
      const byId = (id) => document.getElementById(id);

      const table = byId("f02-the-table-table");
      const heads = q('[class~="f02-the-table-head"]');
      const focus = byId("f02-the-table-focus");
      const letters = q('[class~="f02-the-table-letter"]');
      const lower = letters.filter((el) => el.getAttribute("data-cap") !== "1");
      const capO = letters.filter((el) => el.getAttribute("data-cap") === "1");
      const caret = byId("f02-the-table-caret");
      const legendItems = q('[class~="f02-the-table-lg"]');
      const legendLower = legendItems.filter((el) => el.getAttribute("data-cap") !== "1");
      const words = q('#f02-the-table-line [class~="f02-the-table-w"]');
      const ul = byId("f02-the-table-ul");
      const stage = byId("f02-the-table-stage");

      const tl = gsap.timeline({ paused: true });

      // Slow push-in under the whole shot.
      tl.fromTo(stage, { scale: 1 }, { scale: 1.025, duration: DUR, ease: "none" }, 0);

      // ---- Scene 1: table fragment builds ----
      tl.fromTo(table, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.The);
      tl.fromTo(heads[1], { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" }, CUES.relationship);
      tl.fromTo(heads[0], { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" }, CUES.business);
      tl.fromTo(focus, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, CUES.table);

      // Caret appears in the empty cell, then types the six letters on "what is allowed".
      const typeEnd = Math.min(CUES.allowed + 0.35, DUR - S2_TAIL - 0.5);
      const step = (typeEnd - CUES.what) / letters.length;
      tl.fromTo(caret, { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.01 }, CUES.tells);
      letters.forEach((el, i) => {
        const t = CUES.what + i * step;
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
        tl.set(caret, { x: (i + 1) * 84 - 2 }, t);
      });
      // Deterministic caret blink (finite sets, no repeat), then the caret leaves.
      const caretOff = CUES.It;
      for (let t = typeEnd + 0.25, on = false; t < caretOff; t += 0.25, on = !on) {
        tl.set(caret, { opacity: on ? 1 : 0 }, t);
      }
      tl.set(caret, { opacity: 0 }, caretOff);

      // Legend names the six codes.
      const legendAt = typeEnd + 0.1;
      tl.fromTo(legendItems, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out", stagger: 0.05 }, legendAt);

      // ---- Scene 2: "through what" — clamped so it lands before the frame ends ----
      const S2 = Math.min(CUES.through, DUR - S2_TAIL);
      tl.to(lower, { color: "#6b7280", scale: 0.9, duration: 0.4, ease: "power2.out" }, S2);
      tl.to(capO, { scale: 1.08, duration: 0.4, ease: "back.out(2)" }, S2);
      tl.to(legendLower, { opacity: 0.55, duration: 0.4, ease: "power2.out" }, S2);
      tl.fromTo(words, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", stagger: 0.11 }, S2);
      tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power2.inOut" }, S2 + 0.5);

      // Pin the timeline length to the frame duration (hold to the end).
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-the-table"] = tl;
    })();
