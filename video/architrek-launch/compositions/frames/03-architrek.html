    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        // Every voice cue (seconds from frame start). Re-time the frame by editing this object only.
        const CUES = {
          architrek: 0.0,
          finds: 0.602,
          the: 0.903,
          route: 1.204,
        };
        const DURATION = 2.021;

        const root = document.querySelector('[data-composition-id="03-architrek"]');
        const $ = (id) => root.querySelector('[id="f03-architrek-' + id + '"]');

        const tl = gsap.timeline({ paused: true });

        // Scene 1 — on "ArchiTrek": the mark draws on, then the wordmark sets.
        const t0 = CUES.architrek;
        // Cliff outline strokes in.
        tl.fromTo($('rock'), { attr: { 'stroke-dashoffset': 1 } },
          { attr: { 'stroke-dashoffset': 0 }, duration: 0.38, ease: 'power2.inOut' }, t0 + 0.02);
        // Rock mass tint settles in behind the outline.
        tl.fromTo($('rock-fill'), { opacity: 0 },
          { opacity: 1, duration: 0.25, ease: 'power1.out' }, t0 + 0.22);
        // Strata ledges draw left to right, staggered.
        tl.fromTo($('strata-1'), { attr: { 'stroke-dashoffset': 1 } },
          { attr: { 'stroke-dashoffset': 0 }, duration: 0.22, ease: 'power2.out' }, t0 + 0.2);
        tl.fromTo($('strata-2'), { attr: { 'stroke-dashoffset': 1 } },
          { attr: { 'stroke-dashoffset': 0 }, duration: 0.22, ease: 'power2.out' }, t0 + 0.27);
        // Dashed descent line draws down the face.
        tl.fromTo($('descent-rect'), { attr: { height: 0 } },
          { attr: { height: 19 }, duration: 0.24, ease: 'power1.in' }, t0 + 0.3);
        // Arrowhead lands at the foot of the descent.
        tl.fromTo($('arrow'), { opacity: 0, scale: 0.2, y: -2, svgOrigin: '12.5 24.5' },
          { opacity: 1, scale: 1, y: 0, svgOrigin: '12.5 24.5', duration: 0.2, ease: 'back.out(2.2)' }, t0 + 0.5);

        // Wordmark slides out from behind the mark ("Archi" leads, "Trek" follows).
        tl.fromTo($('archi'), { x: -30, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.36, ease: 'power3.out' }, t0 + 0.36);
        tl.fromTo($('trek'), { x: -40, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.36, ease: 'power3.out' }, t0 + 0.44);

        // Scene 2 — on "finds the route": tagline wipes in, then the sub-line lands in two halves.
        tl.fromTo($('tag-rect'), { attr: { width: 0 } },
          { attr: { width: 130 }, duration: 0.32, ease: 'power2.out' }, CUES.finds - 0.02);
        tl.fromTo($('sub-a'), { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.26, ease: 'power2.out' }, CUES.finds + 0.12);
        tl.fromTo($('sub-b'), { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.26, ease: 'power2.out' }, CUES.the - 0.04);

        // Life in the hold: near-imperceptible settle of the whole lockup across the frame.
        tl.fromTo($('stage'), { scale: 0.985 },
          { scale: 1, duration: DURATION, ease: 'none' }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines['03-architrek'] = tl;
      })();
