<template id="f04-pick-template">
<div id="root" data-composition-id="04-pick" data-width="1920" data-height="1080" data-start="0" data-duration="5.577">
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBM_Plex_Sans_400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBM_Plex_Sans_600.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "IBM Plex Sans", sans-serif;
    }
    .pick04-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #f7f7f7;
    }
    .pick04-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* kicker: 12px orange square + uppercase tracked label */
    .pick04-kicker {
      position: absolute;
      left: 96px;
      top: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 40px;
    }
    .pick04-kicker-sq {
      display: block;
      width: 12px;
      height: 12px;
      background: #ff4500;
    }
    .pick04-kicker-text {
      display: block;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #4a5568;
      line-height: 1;
      white-space: nowrap;
    }
    /* screen-frame window: view area y 128..868 (above the 896 caption cutoff) */
    .pick04-window {
      position: absolute;
      left: 96px;
      top: 128px;
      width: 1728px;
      height: 740px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 0;
      box-shadow: 0 24px 60px rgba(26, 36, 50, 0.18);
      overflow: hidden;
      box-sizing: border-box;
    }
    /* the world: screenshot at 1920x1080 CSS px + highlight box, moved together */
    .pick04-world {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
    }
    .pick04-shot {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }
    .pick04-hl {
      position: absolute;
      left: 0;
      top: 0;
      width: 248px;
      height: 116px;
      border: 1.5px solid #ff4500;
      border-radius: 0;
      box-sizing: border-box;
      transform-origin: 50% 50%;
    }
  </style>

  <div id="pick04-bg" class="clip pick04-bg" data-start="0" data-duration="5.577" data-track-index="0"></div>

  <div id="pick04-stage" class="clip pick04-stage" data-start="0" data-duration="5.577" data-track-index="1">
    <div class="pick04-kicker" id="pick04-kicker">
      <span class="pick04-kicker-sq" id="pick04-kicker-sq"></span>
      <span class="pick04-kicker-text" id="pick04-kicker-text">1 · Pick</span>
    </div>

    <div class="pick04-window" id="pick04-window">
      <div class="pick04-world" id="pick04-world" data-layout-allow-overflow>
        <img class="pick04-shot" src="assets/s02-edit.png" alt="ArchiTrek waypoint editor" width="1920" height="1080" />
        <div class="pick04-hl" id="pick04-hl"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Voice cue times (seconds from frame start). Re-time the frame by editing this object only.
      const CUES = {
        pick: 0.0,
        start: 0.421,
        end: 1.052,
        add: 1.655,
        stop: 1.994,
        between: 2.334,
        then: 3.697,
        click: 4.042,
        find: 4.387,
        path: 4.732
      };
      const DUR = 5.077;
      // Clamp a move starting on a cue so it completes before the frame ends.
      const at = (cue, d) => Math.max(0, Math.min(cue, DUR - 0.05 - d));

      // Window view size (inside 1px border) and target framings in 1920x1080 viewport space.
      const VW = 1726, VH = 738;
      const fit = (s, cx, cy) => {
        // centre (cx, cy) at scale s, clamped so the view never leaves the screenshot
        let x = VW / 2 - cx * s, y = VH / 2 - cy * s;
        x = Math.min(0, Math.max(VW - 1920 * s, x));
        y = Math.min(0, Math.max(VH - 1080 * s, y));
        return { scale: s, x: x, y: y };
      };
      const CAM_FULL = { scale: VW / 1920, x: 0, y: 0 };      // full width
      const CAM_CARDS = fit(2.08, 410, 160);                     // waypoint cards row x 14-806, y 99-207
      const CAM_CARDS_DRIFT = fit(2.13, 410, 160);               // slow settle while held
      const CAM_FIND = fit(2.4, 1858, 196);                      // Find Path button x 1801-1916, y 174-218

      // Highlight boxes (padded 4px around each region)
      const HL_A = { x: 10, y: 95, width: 248, height: 116 };
      const HL_B = { x: 286, y: 95, width: 248, height: 116 };
      const HL_C = { x: 562, y: 95, width: 248, height: 116 };
      const HL_FIND = { x: 1797, y: 170, width: 123, height: 52 };

      const tl = gsap.timeline({ paused: true });

      // Scene 1 — kicker + window establish, push-in to cards
      tl.fromTo("#pick04-kicker-sq", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, CUES.pick);
      tl.fromTo("#pick04-kicker-text", { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, CUES.pick + 0.06);
      tl.fromTo("#pick04-window", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, CUES.pick);
      tl.fromTo("#pick04-world", CAM_FULL, Object.assign({ duration: 0.65, ease: "power2.inOut" }, CAM_CARDS), CUES.pick + 0.3);
      tl.fromTo("#pick04-world", CAM_CARDS, Object.assign({ duration: Math.max(0.1, CUES.click - (CUES.pick + 0.95)), ease: "none", immediateRender: false }, CAM_CARDS_DRIFT), CUES.pick + 0.95);

      // "a start" — highlight card A
      tl.fromTo("#pick04-hl",
        Object.assign({ opacity: 0, scale: 1.12 }, HL_A),
        Object.assign({ opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, HL_A),
        at(CUES.start, 0.3));
      // "and an end" — move to card C
      tl.to("#pick04-hl", Object.assign({ duration: 0.42, ease: "power3.inOut" }, HL_C), at(CUES.end, 0.42));

      // Scene 2 — "a stop in between" — move to card B
      tl.to("#pick04-hl", Object.assign({ duration: 0.4, ease: "power3.inOut" }, HL_B), at(CUES.stop, 0.4));

      // Scene 3 — "click Find Path": camera travels right, box lands on the button, single press
      tl.fromTo("#pick04-world", CAM_CARDS_DRIFT, Object.assign({ duration: 0.5, ease: "power3.inOut", immediateRender: false }, CAM_FIND), at(CUES.click, 0.5));
      tl.to("#pick04-hl", Object.assign({ duration: 0.5, ease: "power3.inOut" }, HL_FIND), at(CUES.click, 0.5));
      tl.to("#pick04-hl", { scale: 0.96, duration: 0.08, ease: "power2.in" }, at(CUES.path, 0.22));
      tl.to("#pick04-hl", { scale: 1, duration: 0.14, ease: "back.out(3)" }, at(CUES.path, 0.22) + 0.08);

      // pad the timeline to the full frame length (hold)
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-pick"] = tl;
    })();
  </script>
</div>
</template>
