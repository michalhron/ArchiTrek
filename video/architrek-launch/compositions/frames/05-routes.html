<template id="routes05-template">
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'IBM Plex Sans', sans-serif;
    color: #1a2432;
  }
  #root .clip { position: absolute; }

  #routes05-bg {
    left: 0; top: 0; width: 1920px; height: 1080px;
    background: #f7f7f7;
  }

  /* Kicker: 12px orange square + uppercase tracked label */
  #routes05-kicker {
    left: 288px; top: 54px;
    display: flex; align-items: center; gap: 14px;
    font-size: 22px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: #4a5568;
    line-height: 1;
  }
  .routes05-kicker-sq { width: 12px; height: 12px; background: #ff4500; flex: none; }

  /* Window: 1344x756 (16:9), y 120-876, above the caption keep-out (896) */
  #routes05-window {
    left: 288px; top: 120px; width: 1344px; height: 756px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    box-shadow: 0 24px 60px rgba(26,36,50,0.18);
    overflow: hidden;
    box-sizing: border-box;
  }
  /* Virtual camera: screenshot at 1920x1080 CSS px + overlays in viewport space */
  .routes05-world {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
  }
  .routes05-shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }

  /* Navy ticks left of each route row (row boxes x 38-668) */
  .routes05-tick {
    position: absolute; left: 29px; width: 5px; height: 22px;
    background: #1a2432;
    transform-origin: 50% 50%;
  }
  /* Navy bracket around the five rows */
  .routes05-hl {
    position: absolute; left: 24px; top: 664px; width: 652px; height: 172px;
    border: 2px solid #1a2432;
    box-sizing: border-box;
    transform-origin: 50% 50%;
  }
  .routes05-label {
    position: absolute; left: 694px; top: 726px;
    background: #ffffff;
    border: 1.5px solid #1a2432;
    padding: 9px 14px 10px;
    display: flex; align-items: baseline; gap: 8px;
    font-size: 20px; font-weight: 600; line-height: 1.2; color: #1a2432;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(26,36,50,0.12);
  }
  .routes05-zero {
    display: inline-block;
    font-size: 30px; font-weight: 700; color: #ff4500; line-height: 1;
    transform-origin: 50% 70%;
  }
</style>

<div id="root" data-composition-id="05-routes" data-start="0" data-duration="6.523" data-width="1920" data-height="1080">
  <div id="routes05-bg" class="clip" data-start="0" data-duration="6.523" data-track-index="0"></div>

  <div id="routes05-kicker" class="clip" data-start="0" data-duration="6.523" data-track-index="2">
    <span class="routes05-kicker-sq"></span><span>2 · Search</span>
  </div>

  <div id="routes05-window" class="clip" data-start="0" data-duration="6.523" data-track-index="1">
    <div id="routes05-world" class="routes05-world" data-layout-allow-overflow>
      <img class="routes05-shot" src="assets/c02-routes-direct.png" alt="">
      <!-- route row ticks, measured: rows y 670-697 / 703-731 / 736-764 / 770-797 / 803-830 -->
      <div class="routes05-tick" id="routes05-tick1" style="top:673px"></div>
      <div class="routes05-tick" id="routes05-tick2" style="top:706px"></div>
      <div class="routes05-tick" id="routes05-tick3" style="top:739px"></div>
      <div class="routes05-tick" id="routes05-tick4" style="top:773px"></div>
      <div class="routes05-tick" id="routes05-tick5" style="top:806px"></div>
      <div class="routes05-hl" id="routes05-hl"></div>
      <div class="routes05-label" id="routes05-label"><span class="routes05-zero" id="routes05-zero">0</span><span>routes through the Application layer</span></div>
    </div>
  </div>
</div>

<script>
(function () {
  // Voice cue times (seconds from frame start). Re-time the frame by editing this object only.
  const CUES = {
    every: 0.0,
    route: 0.517,
    it: 0.725,
    finds: 0.934,
    is: 1.142,
    legal: 1.351,
    but: 2.234,
    none: 2.466,
    of: 2.698,
    them: 2.93,
    passes: 3.162,
    through: 3.566,
    the: 3.798,
    application: 4.031,
    layer: 4.779,
    the2: 5.011,
    case: 5.243,
    describes: 5.475,
    END: 6.523
  };
  const END = CUES.END;
  // Clamp: start no later than END - 0.35, and finish before the frame ends.
  function at(t) { return Math.max(0, Math.min(t, END - 0.35)); }
  function dur(t, d) { return Math.max(0.1, Math.min(d, END - 0.05 - at(t))); }

  const q = (id) => document.getElementById(id);
  const world = q("routes05-world");

  // Camera: window is 1344x756; world is 1920x1080 at scale S, offset (x, y).
  const WIN_W = 1344, WIN_H = 756;
  function frame(cx, cy, S) {
    let x = WIN_W / 2 - cx * S;
    let y = WIN_H / 2 - cy * S;
    x = Math.min(0, Math.max(WIN_W - 1920 * S, x));
    y = Math.min(0, Math.max(WIN_H - 1080 * S, y));
    return { x: x, y: y, scale: S };
  }
  const FIT = { x: 0, y: 0, scale: WIN_W / 1920 };          // full screenshot (0.7)
  const ROUTES = frame(590, 752, 1.15);                       // route list x24-676 + label room to x~1150
  const ROUTES_SETTLE = frame(594, 754, 1.17);                // slow creep under the hold (left edge stays at world x ~20)

  const tl = gsap.timeline({ paused: true });

  // Scene 1 — "Every route": window + kicker establish, push to the route list.
  tl.fromTo(q("routes05-window"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: dur(CUES.every, 0.5), ease: "power2.out" }, at(CUES.every));
  tl.fromTo(q("routes05-kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: dur(CUES.every, 0.45), ease: "power2.out" }, at(CUES.every) + 0.1);
  tl.fromTo(world, FIT, Object.assign({ duration: dur(CUES.every + 0.15, CUES.finds + 0.25 - CUES.every), ease: "power2.inOut" }, ROUTES), at(CUES.every + 0.15));

  // Ticks on the five rows, top to bottom, from "it" through "legal".
  const tickStart = CUES.it;
  const tickStep = (CUES.legal - CUES.it) / 4;
  for (let i = 1; i <= 5; i++) {
    const t = at(tickStart + (i - 1) * tickStep);
    tl.fromTo(q("routes05-tick" + i), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: dur(t, 0.3), ease: "back.out(2)" }, t);
  }

  // Scene 2 — "none": bracket closes on the list, label card sets in beside it. Hold.
  tl.fromTo(q("routes05-hl"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: dur(CUES.none - 0.12, 0.4), ease: "power3.out" }, at(CUES.none - 0.12));
  tl.fromTo(q("routes05-label"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: dur(CUES.none, 0.42), ease: "power2.out" }, at(CUES.none));
  // the "0" lands on "application"
  tl.fromTo(q("routes05-zero"), { scale: 1 }, { scale: 1.18, duration: dur(CUES.application, 0.16), ease: "power2.out" }, at(CUES.application));
  tl.fromTo(q("routes05-zero"), { scale: 1.18 }, { scale: 1, duration: dur(CUES.application + 0.16, 0.3), ease: "power2.inOut", immediateRender: false }, at(CUES.application + 0.16));

  // Quiet camera creep under the hold, from "legal" to the end.
  tl.fromTo(world, ROUTES, Object.assign({ duration: dur(CUES.legal, END - CUES.legal), ease: "sine.inOut", immediateRender: false }, ROUTES_SETTLE), at(CUES.legal));

  window.__timelines = window.__timelines || {};
  window.__timelines["05-routes"] = tl;
})();
</script>
</template>
