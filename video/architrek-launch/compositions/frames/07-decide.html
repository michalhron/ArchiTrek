</div>

<script>
(function () {
  // Voice cue times (s from frame start). Re-time the frame by editing this object only.
  const CUES = {
    you: 0.266,
    decide: 0.266,
    each: 0.572,
    hop: 0.706,
    rightClick: 0.706,
    an: 0.951,
    arrow: 1.146,
    to: 1.447,
    choose: 1.462,
    its: 2.050,
    relationship: 2.352
  };
  const DURATION = 3.52;
  const MIN_LEAD = 0.35;

  // Start a move at `t` but make sure it finishes before the frame ends.
  function fit(t, dur) {
    const latestEnd = DURATION - 0.05;
    let start = Math.min(t, DURATION - MIN_LEAD);
    return { start: Math.max(0, start), dur: Math.max(0.2, Math.min(dur, latestEnd - Math.max(0, start))) };
  }

  // Camera math: window view 1728×732; centre point (cx, cy) in 1920×1080 viewport px at scale s.
  const VW = 1728, VH = 732;
  function cam(s, cx, cy) {
    const halfH = VH / 2 / s, halfW = VW / 2 / s;
    cy = Math.min(Math.max(cy, halfH), 1080 - halfH); // never show past the screenshot edge
    cx = Math.min(Math.max(cx, halfW), 1920 - halfW);
    return { scale: s, x: VW / 2 - cx * s, y: VH / 2 - cy * s };
  }
  // Target region: diagram (540–1360, 120–230) ∪ menus (741–1035, 167–309) → centre ≈ (950, 215)
  const WIDE = cam(1.0, 950, 300);
  const PUSH = cam(2.02, 950, 216);
  const DRIFT = cam(2.1, 952, 218);

  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Scene 1 — surface establishes, kicker in, camera pushes in on diagram + menu
  tl.fromTo("#decide-06-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, CUES.you);
  tl.fromTo("#decide-06-window", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, CUES.you);
  tl.fromTo("#decide-06-world", WIDE, Object.assign({}, PUSH, { duration: Math.max(0.4, CUES.hop + 0.35 - CUES.decide), ease: "power2.inOut" }), CUES.decide);
  // slow continuous drift so the held framing never freezes
  const driftStart = CUES.hop + 0.35;
  tl.to("#decide-06-world", Object.assign({}, DRIFT, { duration: Math.max(0.2, DURATION - driftStart), ease: "none" }), driftStart);

  // "Right-click an arrow" — highlight box outlines the submenu list
  const hl = fit(CUES.rightClick, 0.4);
  tl.fromTo("#decide-06-hl", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: hl.dur, ease: "power3.out" }, hl.start);

  // Scene 2 — "choose its relationship": crossfade to the decided route at the same framing
  const xf = fit(CUES.choose, 0.6);
  tl.fromTo("#decide-06-shot-route", { opacity: 0 }, { opacity: 1, duration: xf.dur, ease: "power1.inOut" }, xf.start);
  tl.fromTo("#decide-06-hl", { opacity: 1 }, { opacity: 0, duration: Math.min(0.3, xf.dur), ease: "power1.in", immediateRender: false }, xf.start);

  // full-span anchor
  tl.to({}, { duration: DURATION }, 0);
  window.__timelines["07-decide"] = tl;
})();
</script>
