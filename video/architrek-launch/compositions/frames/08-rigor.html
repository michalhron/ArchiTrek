      @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
      @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        // Cue times (s from frame start). Re-time the frame by editing this object only.
        const CUES = {
          keep: 0.0,
          the: 0.212,
          search: 0.425,
          strict: 0.637,
          for: 0.849,
          your: 1.062,
          assignments: 1.274,
          or: 2.104,
          loosen: 2.329,
          it: 2.721,
          to: 2.946,
          explore: 3.171
        };
        const DUR = 3.563;
        // Clamp a reveal so it completes before the frame ends.
        const at = (cue, d) => Math.max(0, Math.min(cue, DUR - d - 0.02));

        const root = document.querySelector('[data-composition-id="08-rigor"]');
        const qa = (s) => root.querySelectorAll(s);

        // Camera states (wrapper scale + translate, transform-origin 0 0).
        const CAM_WIDE = { scale: 0.675, x: 0, y: 0 };            // whole screen fits the window
        const CAM_PANEL = { scale: 1.55, x: -1676, y: -124 };     // options panel fills the right of the view
        const CAM_DRIFT = { scale: 1.575, x: -1717.7, y: -131.9 }; // slow settle, panel centre held

        const tl = gsap.timeline({ paused: true });

        // Scene 1 — establish, kicker, push in on the options panel
        tl.fromTo(root.querySelector('#f08-rigor-kicker'), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, at(CUES.keep, 0.4));
        tl.fromTo(root.querySelector('#f08-rigor-window'), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, at(CUES.keep, 0.4));
        tl.fromTo(root.querySelector('#f08-rigor-world'), { ...CAM_WIDE }, { ...CAM_PANEL, duration: 0.75, ease: 'power3.inOut' }, at(CUES.the, 0.75) - 0.1);

        // "strict" — highlight the Semantic rigor select (Academic (Strict))
        tl.fromTo(root.querySelector('#f08-rigor-hl'), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power3.out' }, at(CUES.strict, 0.35) + 0.12);

        // Continuous slow settle so the hold never freezes
        tl.fromTo(root.querySelector('#f08-rigor-world'), { ...CAM_PANEL }, { ...CAM_DRIFT, duration: DUR - 0.865, ease: 'none', immediateRender: false }, 0.865);

        // Scene 2 — "loosen it to explore": three rigor chips set in left of the panel
        tl.fromTo(qa('[data-r="chip"]'), { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power3.out', stagger: 0.12 }, at(CUES.loosen, 0.35 + 0.24));

        window.__timelines = window.__timelines || {};
        window.__timelines["08-rigor"] = tl;
      })();
