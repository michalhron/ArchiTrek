<template id="f10-rigor-template">
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }

  #root {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  #rigor10-bg {
    position: absolute;
    left: 0; top: 0;
    width: 1920px; height: 1080px;
    background: #f7f7f7;
  }

  /* kicker: 12px orange square + uppercase tracked label */
  #rigor10-kicker {
    position: absolute;
    left: 96px;
    top: 52px;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #4a5568;
    white-space: nowrap;
  }
  #rigor10-kicker .rigor10-sq {
    width: 12px; height: 12px;
    background: #ff4500;
    flex: none;
  }

  /* the camera view: between the kicker and the preset strip (y 120 → 760) */
  #rigor10-view {
    position: absolute;
    left: 0;
    top: 120px;
    width: 1920px;
    height: 640px;
    overflow: hidden;
  }
  .rigor10-world {
    position: absolute;
    left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    box-shadow: 0 24px 60px rgba(26,36,50,0.18);
    box-sizing: border-box;
    overflow: hidden;
  }
  .rigor10-world img {
    display: block;
    width: 1920px; height: 1080px;
  }
  /* highlight on the Semantic rigor control, in screenshot px (set from REGIONS) */
  #rigor10-hl {
    position: absolute;
    border: 1.5px solid #ff4500;
    box-sizing: border-box;
    opacity: 0;
  }

  /* the three presets as a strip above the caption band */
  #rigor10-strip {
    position: absolute;
    left: 96px;
    top: 786px;
    display: flex;
    gap: 16px;
  }
  .rigor10-chip {
    box-sizing: border-box;
    width: 340px;
    padding: 14px 24px;
    background: #ffffff;
    border: 2px solid #e5e7eb;
    color: #1a2432;
    opacity: 0;
  }
  .rigor10-chip b {
    display: block;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.15;
  }
  .rigor10-chip span {
    display: block;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.3;
    color: #4a5568;
  }
  #rigor10-mark {
    position: absolute;
    left: 0;
    top: 0;
    width: 340px;
    height: 100%;
    box-sizing: border-box;
    border: 3px solid #ff4500;
    opacity: 0;
  }
</style>

<div id="root" data-composition-id="10-rigor" data-width="1920" data-height="1080" data-duration="8.94">
  <div id="rigor10-bg" class="clip" data-start="0" data-duration="8.94" data-track-index="0"></div>

  <div id="rigor10-view" class="clip" data-start="0" data-duration="8.94" data-track-index="1">
    <div id="rigor10-w0" class="rigor10-world" data-layout-allow-overflow>
      <img src="assets/r0-options.png" alt="">
      <div id="rigor10-hl"></div>
    </div>
    <div id="rigor10-w1" class="rigor10-world" data-layout-allow-overflow><img src="assets/r1-academic.png" alt=""></div>
    <div id="rigor10-w2" class="rigor10-world" data-layout-allow-overflow><img src="assets/r2-pragmatic.png" alt=""></div>
    <div id="rigor10-w3" class="rigor10-world" data-layout-allow-overflow><img src="assets/r3-discovery.png" alt=""></div>
  </div>

  <div id="rigor10-kicker" class="clip" data-start="0" data-duration="8.94" data-track-index="2">
    <span class="rigor10-sq"></span><span>7 · Rigor</span>
  </div>

  <div id="rigor10-strip" class="clip" data-start="0" data-duration="8.94" data-track-index="3">
    <div id="rigor10-c1" class="rigor10-chip"><b>Academic</b><span>Strict</span></div>
    <div id="rigor10-c2" class="rigor10-chip"><b>Pragmatic</b><span>Balanced</span></div>
    <div id="rigor10-c3" class="rigor10-chip"><b>Discovery</b><span>Loose</span></div>
    <div id="rigor10-mark"></div>
  </div>
</div>

<script>
  (function () {
    // Voice cue times (seconds from frame start). Re-time the frame by editing this object only.
    const CUES = {
      strict: 1.059,
      academic: 2.157,
      pragmatic: 4.263,
      discovery: 5.821,
      END: 8.44
    };
    const END = CUES.END;

    // Regions in the screenshots' 1920×1080 px: [x, y, w, h].
    const CONTROL = [0, 0, 400, 100];   // Semantic rigor control in r0-options
    const RESULTS = [0, 0, 1920, 1080]; // what each preset shot is framed on

    const VIEW_W = 1920, VIEW_H = 640;
    function cam(r, maxScale, creep = 1) {
      const [x, y, w, h] = r;
      const s = Math.min(VIEW_W * 0.9 / w, VIEW_H * 0.9 / h, maxScale) * creep;
      const cx = x + w / 2, cy = y + h / 2;
      return {
        scale: s,
        x: Math.min(0, Math.max(VIEW_W - 1920 * s, VIEW_W / 2 - cx * s)),
        y: Math.min(0, Math.max(VIEW_H - 1080 * s, VIEW_H / 2 - cy * s))
      };
    }
    const WIDE = cam([0, 0, 1920, 1080], 1);
    const STEP = 356; // chip width + gap

    const tl = gsap.timeline({ paused: true });

    gsap.set("#rigor10-hl", { left: CONTROL[0] - 6, top: CONTROL[1] - 6, width: CONTROL[2] + 12, height: CONTROL[3] + 12 });

    // Scene 1 — kicker in, the Options panel, camera pushes in on Semantic rigor; the three chips set in.
    tl.fromTo("#rigor10-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
    tl.fromTo("#rigor10-w0", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
    tl.fromTo("#rigor10-w0", WIDE, Object.assign({ duration: Math.max(0.6, CUES.strict - 0.1), ease: "power3.inOut", immediateRender: false }, cam(CONTROL, 2.4)), 0.1);
    tl.fromTo("#rigor10-hl", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, CUES.strict);
    tl.fromTo(".rigor10-chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.08 }, CUES.strict + 0.2);
    tl.set(["#rigor10-w1", "#rigor10-w2", "#rigor10-w3"], { opacity: 0 }, 0);

    // Scenes 2–4 — hard cut to the same search under each preset; the orange mark moves to its chip.
    const presets = ["academic", "pragmatic", "discovery"];
    presets.forEach((key, i) => {
      const t = CUES[key] - 0.05;
      const w = "#rigor10-w" + (i + 1);
      const shot = cam(RESULTS, 2.4);
      tl.set(w, Object.assign({ opacity: 1 }, shot), t);
      tl.set(i === 0 ? "#rigor10-w0" : "#rigor10-w" + i, { opacity: 0 }, t);
      const next = i < 2 ? CUES[presets[i + 1]] - 0.05 : END;
      tl.fromTo(w, shot, Object.assign({ duration: next - t, ease: "none", immediateRender: false }, cam(RESULTS, 2.4, 1.03)), t);
      if (i === 0) tl.fromTo("#rigor10-mark", { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.15, ease: "none" }, t);
      else tl.to("#rigor10-mark", { x: i * STEP, duration: 0.22, ease: "power3.inOut" }, t);
    });

    // full-span anchor
    tl.to({}, { duration: END }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines["10-rigor"] = tl;
  })();
</script>
</template>
