<template id="f11-more-template">
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBM_Plex_Sans_700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }

  #root {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  #more11-bg {
    position: absolute;
    left: 0; top: 0;
    width: 1920px; height: 1080px;
    background: #f7f7f7;
  }

  /* kicker: 12px orange square + uppercase tracked label */
  #more11-kicker {
    position: absolute;
    left: 96px;
    top: 52px;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #4a5568;
    white-space: nowrap;
  }
  #more11-kicker .more11-sq {
    width: 12px; height: 12px;
    background: #ff4500;
    flex: none;
  }

  /* the camera view: between the kicker and the caption band (y 120 → 896) */
  #more11-view {
    position: absolute;
    left: 0;
    top: 120px;
    width: 1920px;
    height: 776px;
    overflow: hidden;
  }
  /* the wall: 4 × 2 tiles, each a 1920×1080 screenshot at TILE scale, in world px */
  #more11-world {
    position: absolute;
    left: 0; top: 0;
    width: 1920px; height: 776px;
    transform-origin: 0 0;
  }
  .more11-tile {
    position: absolute;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    background: #ffffff;
    border: 3px solid #e5e7eb;
    box-shadow: 0 40px 100px rgba(26,36,50,0.18);
    box-sizing: border-box;
    overflow: hidden;
  }
  .more11-tile img {
    display: block;
    width: 1920px; height: 1080px;
  }

  /* feature label, screen space, bottom-left above the caption band */
  #more11-label {
    position: absolute;
    left: 96px;
    top: 772px;
    height: 84px;
  }
  .more11-name {
    position: absolute;
    left: 0; top: 0;
    padding: 18px 30px;
    background: #1a2432;
    color: #ffffff;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    opacity: 0;
  }
</style>

<div id="root" data-composition-id="11-more" data-width="1920" data-height="1080" data-duration="10.5">
  <div id="more11-bg" class="clip" data-start="0" data-duration="10.5" data-track-index="0"></div>

  <div id="more11-view" class="clip" data-start="0" data-duration="10.5" data-track-index="1">
    <div id="more11-world" data-layout-allow-overflow>
      <div id="more11-t0" class="more11-tile"><img src="assets/m1-viewpoints.png" alt=""></div>
      <div id="more11-t1" class="more11-tile"><img src="assets/m2-evidence.png" alt=""></div>
      <div id="more11-t2" class="more11-tile"><img src="assets/m3-spec.png" alt=""></div>
      <div id="more11-t3" class="more11-tile"><img src="assets/m8-swimlanes.png" alt=""></div>
      <div id="more11-t4" class="more11-tile"><img src="assets/m6-share.png" alt=""></div>
      <div id="more11-t5" class="more11-tile"><img src="assets/m4-themes.png" alt=""></div>
      <div id="more11-t6" class="more11-tile"><img src="assets/m5-metamodel.png" alt=""></div>
      <div id="more11-t7" class="more11-tile"><img src="assets/m7-feedback.png" alt=""></div>
    </div>
  </div>

  <div id="more11-kicker" class="clip" data-start="0" data-duration="10.5" data-track-index="2">
    <span class="more11-sq"></span><span>8 · And more</span>
  </div>

  <div id="more11-label" class="clip" data-start="0" data-duration="10.5" data-track-index="3">
    <div id="more11-n0" class="more11-name">Viewpoints</div>
    <div id="more11-n1" class="more11-name">Evidence labels</div>
    <div id="more11-n2" class="more11-name">Spec definitions</div>
    <div id="more11-n3" class="more11-name">Swimlanes</div>
    <div id="more11-n4" class="more11-name">Share links</div>
    <div id="more11-n5" class="more11-name">Story themes</div>
  </div>
</div>

<script>
  (function () {
    // Voice cue times (seconds from frame start). Re-time the frame by editing this object only.
    const CUES = {
      more: 0.894,
      viewpoints: 1.897,
      evidence: 2.77,
      spec: 3.911,
      swimlanes: 4.826,
      share: 5.682,
      story: 6.593,
      death: 8.899,
      END: 10.0
    };
    const END = CUES.END;

    // The wall: 4 columns × 2 rows of 1920×1080 tiles at TILE scale, centred in the 1920×776 view.
    const TILE = 0.205, GAP = 28;
    const TW = 1920 * TILE, TH = 1080 * TILE;
    const COLS = 4;
    const X0 = (1920 - (COLS * TW + (COLS - 1) * GAP)) / 2;
    const Y0 = (776 - (2 * TH + GAP)) / 2;
    const origin = (i) => ({ x: X0 + (i % COLS) * (TW + GAP), y: Y0 + Math.floor(i / COLS) * (TH + GAP) });

    // Region each spoken item zooms to, in the screenshot's 1920×1080 px: [x, y, w, h].
    const REGIONS = [
      [0, 0, 1920, 1080],
      [0, 0, 1920, 1080],
      [0, 0, 1920, 1080],
      [0, 0, 1920, 1080],
      [0, 0, 1920, 1080],
      [0, 0, 1920, 1080]
    ];

    // Camera that frames region r of tile i in the view (at most 2.4× the screenshot, which stays sharp).
    const VIEW_W = 1920, VIEW_H = 776;
    function cam(i, r) {
      const [x, y, w, h] = r;
      const o = origin(i);
      const fit = Math.min(VIEW_W * 0.86 / w, VIEW_H * 0.8 / h, 2.4);
      const s = fit / TILE;
      const cx = o.x + (x + w / 2) * TILE, cy = o.y + (y + h / 2) * TILE;
      return { scale: s, x: VIEW_W / 2 - cx * s, y: VIEW_H / 2 - cy * s };
    }
    const WALL = { scale: 1, x: 0, y: 0 };

    const tl = gsap.timeline({ paused: true });

    // Lay the tiles out on the wall.
    for (let i = 0; i < 8; i++) {
      const o = origin(i);
      tl.set("#more11-t" + i, { x: o.x, y: o.y, scale: TILE }, 0);
    }

    // Scene 1 — "so much more": kicker in, the wall of tiles pops in, staggered.
    tl.fromTo("#more11-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
    tl.set("#more11-world", WALL, 0);
    for (let i = 0; i < 8; i++) {
      tl.fromTo("#more11-t" + i, { opacity: 0, y: origin(i).y + 40 }, { opacity: 1, y: origin(i).y, duration: 0.35, ease: "power3.out" }, 0.1 + i * 0.07);
    }

    // Scenes 2–7 — on each spoken item, the camera dives into its tile and its label sets in.
    const items = ["viewpoints", "evidence", "spec", "swimlanes", "share", "story"];
    let prev = WALL;
    items.forEach((key, i) => {
      const t = CUES[key] - 0.12;
      const shot = cam(i, REGIONS[i]);
      const move = i === 0 ? 0.5 : 0.36;
      tl.fromTo("#more11-world", prev, Object.assign({ duration: move, ease: "power3.inOut", immediateRender: false }, shot), t);
      if (i > 0) tl.to("#more11-n" + (i - 1), { opacity: 0, duration: 0.12, ease: "power1.in" }, t);
      tl.fromTo("#more11-n" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t + move * 0.6);
      prev = shot;
    });

    // Last item holds with a slow creep, then on "Death Star" the camera pulls back out to the whole wall.
    const pull = Math.min(CUES.death + 0.1, END - 1.0);
    tl.to("#more11-n5", { opacity: 0, duration: 0.2, ease: "power1.in" }, pull);
    tl.fromTo("#more11-world", prev, Object.assign({ duration: 0.8, ease: "power3.inOut", immediateRender: false }, WALL), pull);

    // full-span anchor
    tl.to({}, { duration: END }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines["11-more"] = tl;
  })();
</script>
</template>
