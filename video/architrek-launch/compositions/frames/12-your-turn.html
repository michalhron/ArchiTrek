    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        // Voice cue times, seconds from frame start. Re-time the frame by editing only this object.
        const CUES = {
          next: 0.000,
          the1: 0.522,
          company: 0.812,
          wants: 1.532,
          to: 1.822,
          replace: 2.112,
          the2: 2.616,
          mainframe: 2.906,
          with1: 3.411,
          a: 3.701,
          cloud: 3.991,
          server: 4.281,
          which1: 5.294,
          elements: 5.547,
          change: 6.177,
          which2: 6.790,
          arrows: 7.071,
          model: 8.253,
          it: 8.687,
          with2: 8.935,
          archiTrek: 9.184,
          END: 10.32
        };
        const END = CUES.END;
        const MARGIN = 0.35;
        // Start a reveal at its cue, clamped so it completes at least MARGIN before the end.
        function at(cue, dur) {
          return Math.max(0, Math.min(cue, END - MARGIN - dur));
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Macro camera: a slow push-in under the whole shot.
        tl.fromTo("#turn10-stage", { scale: 1 }, { scale: 1.02, transformOrigin: "960px 490px", duration: END, ease: "none" }, 0);

        // Scene 1: the picture is on screen at t=0. On "replace the mainframe" the Mainframe dims,
        // then a grey arrow points right and the dashed Cloud server slides in.
        tl.fromTo("#turn10-mainframe", { opacity: 1 }, { opacity: 0.35, duration: 0.5, ease: "power2.out" }, at(CUES.replace, 0.5));
        tl.fromTo("#turn10-move-line", { attr: { "stroke-dashoffset": 138 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out" }, at(CUES.with1, 0.45));
        tl.fromTo("#turn10-move-head", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, at(CUES.with1, 0.45) + 0.35);
        tl.fromTo("#turn10-cloud", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, at(CUES.a, 0.6));

        // Scene 2: "Which elements change?" -> orange outline frames the Technology band.
        tl.fromTo("#turn10-outline", { opacity: 0, scale: 1.02, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, at(CUES.elements, 0.45));

        // Scene 3: "Which arrows?" -> the outline lifts off; inter-layer arrows turn dashed grey with "?" hop badges.
        tl.to("#turn10-outline", { opacity: 0, scale: 1.015, duration: 0.3, ease: "power2.in" }, at(CUES.which2, 0.3));
        tl.fromTo(["#turn10-real-grey", "#turn10-serv-grey"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, at(CUES.arrows, 0.4));
        tl.to(["#turn10-real-navy", "#turn10-serv-navy"], { opacity: 0, duration: 0.4, ease: "power1.out" }, at(CUES.arrows, 0.4));
        tl.fromTo("#turn10-hop-lower", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, at(CUES.arrows, 0.4) + 0.05);
        tl.fromTo("#turn10-hop-upper", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, at(CUES.arrows, 0.4) + 0.17);

        // Scene 4: "Model it with ArchiTrek." -> the card sets in at the right; the address lands on "ArchiTrek".
        tl.fromTo("#turn10-card", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, at(CUES.model, 0.55));
        tl.fromTo("#turn10-card-logo", { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, at(CUES.it, 0.45));
        tl.fromTo("#turn10-card-url", { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, at(CUES.archiTrek, 0.45));

        // Pad the timeline to the full frame duration (hold to the end).
        tl.set({}, {}, END);

        window.__timelines["10-your-turn"] = tl;
      })();
    </script>
