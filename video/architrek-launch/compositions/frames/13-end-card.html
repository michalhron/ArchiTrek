<template id="f13-end-card-template">
  <div id="root" data-composition-id="13-end-card" data-width="1920" data-height="1080" data-start="0" data-duration="3">
    <style>
      @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBM_Plex_Sans_400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBM_Plex_Sans_600.woff2") format("woff2"); font-weight: 600; font-style: normal; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "IBM Plex Sans", sans-serif;
      }
      .ec10-bg {
        position: absolute;
        inset: 0;
        background: #1a2432;
      }
      .ec10-stage {
        position: absolute;
        inset: 0;
      }
      .ec10-logo {
        position: absolute;
        left: 576px;
        top: 250px;
        width: 768px;
        height: 153.6px;
        display: block;
      }
      .ec10-rule {
        position: absolute;
        left: 900px;
        top: 486px;
        width: 120px;
        height: 4px;
        background: #ff4500;
      }
      .ec10-url {
        position: absolute;
        left: 0;
        top: 516px;
        width: 1920px;
        text-align: center;
        color: #ffffff;
        font-size: 60px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.005em;
      }
      .ec10-note {
        position: absolute;
        left: 0;
        top: 626px;
        width: 1920px;
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.4;
      }
    </style>

    <div id="ec10-bg" class="clip ec10-bg" data-start="0" data-duration="3" data-track-index="0"></div>

    <div id="ec10-stage" class="clip ec10-stage" data-start="0" data-duration="3" data-track-index="1">
      <img id="ec10-logo" class="ec10-logo" src="assets/logo.svg" alt="ArchiTrek" />
      <div id="ec10-rule" class="ec10-rule"></div>
      <div id="ec10-url" class="ec10-url">architrek.hronmichal.net</div>
      <div id="ec10-note" class="ec10-note">Unofficial study tool · ArchiMate is a registered trademark of The Open Group</div>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        // Voice cue times, seconds from frame start. Re-time the frame by editing only this object.
        const CUES = {
          archiTrek: 0.0,
          free: 0.9,
          and: 1.3,
          it: 1.45,
          runs: 1.6,
          in: 1.8,
          your: 1.95,
          browser: 2.1,
          end: 3
        };
        // Everything is revealed by roughly the "in" cue, then holds still.
        const REVEAL_DONE = CUES.in - 0.03;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1: logo fades in and settles from a slight scale-down on "ArchiTrek".
        tl.fromTo("#ec10-logo",
          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
          CUES.archiTrek);

        // Scene 2: on "Free", the orange rule draws, then the address sets in under it.
        tl.fromTo("#ec10-rule",
          { scaleX: 0, transformOrigin: "50% 50%" },
          { scaleX: 1, duration: 0.4, ease: "power2.out" },
          CUES.free);
        tl.fromTo("#ec10-url",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          CUES.free + 0.08);

        // The small trademark line follows, landing as the reveal completes.
        const noteDur = 0.45;
        tl.fromTo("#ec10-note",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: noteDur, ease: "power2.out" },
          Math.max(CUES.free + 0.3, REVEAL_DONE - noteDur));

        // Hold still to the end of the frame.
        tl.set({}, {}, CUES.end);

        window.__timelines["13-end-card"] = tl;
      })();
    </script>
  </div>
</template>
